name: Pregame prop snapshot
on:
  schedule:
    - cron: "11 17,20,22,23 * * *"   # 12, 3, 5 and 6 PM Eastern (standard time): last prices before most tips
    - cron: "41 0,1,2 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/snapshot-pregame.mjs", "scripts/props-model/predict.mjs", ".github/workflows/pregame.yml"]
permissions:
  contents: write
concurrency: pregame
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot-pregame.mjs
      - run: node scripts/props-model/predict.mjs
      - name: Commit if changed
        run: |
          git config user.name "sharpline-bot"
          git config user.email "sharpline-bot@users.noreply.github.com"
          git add data/pregame data/nba/predictions
          git diff --cached --quiet && exit 0
          git commit -m "Pregame prop snapshot"
          git pull --rebase -q origin "${{ github.ref_name }}"
          git push -q origin "HEAD:${{ github.ref_name }}"
