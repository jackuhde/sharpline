name: Prop line history
on:
  schedule:
    - cron: "37 9 * * *"   # daily, after the previous night's games are final
  workflow_dispatch:
  push:
    paths: ["scripts/collect-props.mjs", ".github/workflows/props-history.yml"]
permissions:
  contents: write
concurrency: props-history
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect-props.mjs
      - name: Commit if changed
        run: |
          git config user.name "sharpline-bot"
          git config user.email "sharpline-bot@users.noreply.github.com"
          git add data/props-history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prop line history"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
