name: Opponent vs position stats
on:
  schedule:
    - cron: "17 9 * * *"   # daily, after the previous night's games are final
  workflow_dispatch:
  push:
    paths: ["scripts/build-dvp.mjs", ".github/workflows/dvp.yml"]
permissions:
  contents: write
concurrency: dvp
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-dvp.mjs
      - name: Commit if changed
        run: |
          git config user.name "sharpline-bot"
          git config user.email "sharpline-bot@users.noreply.github.com"
          git add dvp.json data/dvp-games.json
          git diff --cached --quiet && exit 0
          git commit -m "Update opponent vs position stats"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
