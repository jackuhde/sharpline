name: Live site diagnostic
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save puppeteer-core@22
      - name: ESPN CORS check
        run: |
          for u in "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events?limit=1"; do
            echo "== $u"; curl -s -o /dev/null -D - -H "Origin: https://jackuhde.github.io" "$u" | grep -i -E "^HTTP|access-control|content-type" || true; done | tee espn.txt
          mkdir -p diag && cp espn.txt diag/espn.txt
      - run: node scripts/diag/live.mjs
        env: { CHROME: /usr/bin/google-chrome }
      - name: Publish result to the diag branch
        run: |
          cp diag/live.json /tmp/live.json; cp diag/espn.txt /tmp/espn.txt
          git config user.name "sharpline-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan diag-out
          git rm -rq --cached . 
          mkdir -p out && cp /tmp/live.json out/live.json && cp /tmp/espn.txt out/espn.txt
          git add out
          git commit -qm "Live diagnostic $(date -u +%FT%TZ)"
          git push -f origin diag-out:diag
