<!doctype html><meta charset=utf-8><body style="font:12px monospace;background:#fff;color:#000"><pre id=o>loading</pre><script>
const o=document.getElementById("o");o.textContent="";const log=s=>o.textContent+=s+"\n";
const C="https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba";
const J=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
(async()=>{log("now "+new Date().toISOString());
 const sb=await J("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard");
 const lives=sb.events.filter(e=>e.competitions[0].status.type.state==="in");
 for(const e of lives){const id=e.id;log("\n== "+e.shortName+" "+e.competitions[0].status.type.shortDetail);
  try{const pb=await J(`${C}/events/${id}/competitions/${id}/odds/200/propBets?lang=en&region=us&limit=1000`);
    const ty={};pb.items.forEach(x=>ty[x.type.name]=(ty[x.type.name]||0)+1);log("LIVE(200) propBets "+pb.count+" "+JSON.stringify(ty));
    const ups=pb.items.map(x=>x.lastUpdated).sort();log("updated range "+ups[0]+" .. "+ups[ups.length-1]);
    pb.items.filter(x=>x.type.id==="1").slice(0,8).forEach(x=>log("  pts "+(x.athlete.$ref.match(/athletes\/(\d+)/)||[])[1]+" "+x.odds.total.value+" "+x.odds.american.value+" open "+x.odds.total.open+" "+x.odds.american.open+" upd "+x.lastUpdated));
  }catch(e){log("200 propBets ERR "+e)}
  try{const pb=await J(`${C}/events/${id}/competitions/${id}/odds/100/propBets?lang=en&region=us&limit=1000`);
    const ty={};pb.items.forEach(x=>ty[x.type.name]=(ty[x.type.name]||0)+1);log("PRE(100) propBets "+pb.count+" pts:"+(ty["Total Points"]||0));
  }catch(e){log("100 ERR "+e)}
  try{const od=await J(`${C}/events/${id}/competitions/${id}/odds/200`);log("200 odds details "+od.details+" ou "+od.overUnder+" ml "+JSON.stringify([od.awayTeamOdds&&od.awayTeamOdds.current&&od.awayTeamOdds.current.moneyLine,od.homeTeamOdds&&od.homeTeamOdds.current&&od.homeTeamOdds.current.moneyLine]).slice(0,200));log(" 200 keys "+Object.keys(od).join(","));log(" away "+JSON.stringify(od.awayTeamOdds).slice(0,500))}catch(e){log("200 odds ERR "+e)}
 }
})();
</script>
